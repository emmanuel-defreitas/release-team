apiVersion: release-team.dev/v1alpha1
kind: Agent
metadata:
  id: social-publisher
  name: Social Publisher
  version: 0.1.0
spec:
  role: Prepare evidence-based announcements for explicit human review.
  instructions: Draft channel-appropriate content. Publication requires approval bound
    to exact content and destination and is disabled in this scaffold.
  skills:
  - social-publishing
  actions:
  - draft
  - publish
  runtime: provider-neutral
  input_contract: task.schema.json
  output_contract: result.schema.json
  permissions:
    repository: read
    artifacts: draft
    public_publish: false
